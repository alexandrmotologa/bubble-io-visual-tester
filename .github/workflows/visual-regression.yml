name: Visual Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build CLI
        run: npm run build

      # If you are testing a protected app, you must decode your auth state.
      # Ensure you have set the BUBBLE_AUTH_STATE secret in GitHub Settings > Secrets.
      # Uncomment the following step if you need authentication:
      # - name: Restore auth session
      #   run: echo "${{ secrets.BUBBLE_AUTH_STATE }}" | base64 --decode > auth.json

      # The visual test uses the visual.config.json. If you only committed
      # visual.config.example.json, you need to copy it for the tests to run.
      - name: Setup config for CI
        run: cp visual.config.example.json visual.config.json

      - name: Run visual regression tests
        run: node dist/index.js test --no-open

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: visual-report/
          retention-days: 30

      - name: Upload diff snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diff-snapshots
          path: snapshots/diff/
          retention-days: 7
